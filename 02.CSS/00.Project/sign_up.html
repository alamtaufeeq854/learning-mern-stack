<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="../../icons/signup.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        padding: 0;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #452654;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: rgb(2, 243, 243);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 10px;
        width: 300px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      form input {
        margin: 8px 0;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        margin-right: 15px;
      }
      form input::placeholder {
        color: #0e0e0d;
        opacity: 1;
      }
      .container {
        display: flex;
        justify-content: space-between;
      }
      .container input {
        width: 48%;
        margin-right: 15px;
      }

      button {
        border-radius: 5px;
        padding: 10px;
        border: none;
        background-color: #d9dc1f;
        cursor: pointer;
        margin-top: 11px;
      }

      form {
        display: flex;
        flex-direction: column;
      }

      button:hover {
        background-color: #06f006;
      }
    </style>
    <title>Sign Up Page</title>
  </head>
  <body>
    <div class="card">
      <form>
        <input
          type="email"
          class="email"
          placeholder="Enter Your Email Here"
          required />
        <div class="container">
          <input type="text" class="first" placeholder="First Name" />
          <input type="text" class="second" placeholder="Last Name" />
        </div>
        <input type="password" placeholder="Password" required />
        <button type="submit">Sign-up</button>
      </form>
    </div>
  </body>
</html>
